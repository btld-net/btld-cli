name: Deploy site to cdn
on:
  workflow_call:
    secrets:
      BUNNY_ZONE_NAME:
        required: true
      BUNNY_PW_SITE:
        required: true
      BUNNY_API_KEY:
        required: true
      BUNNY_ZONE_ID:
        required: true
jobs:
  deploy:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    concurrency: # Serialize deploys (prevent race), never cancel mid-upload
      group: deploy-cdn-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "lts/*"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site for cdn
        run: npm run build-cdn

      - name: Deploy to BunnyCDN
        uses: ayeressian/bunnycdn-storage-deploy@v2.4.6
        with:
          source: "dist"
          destination: ""
          pullZoneId: ${{ secrets.BUNNY_ZONE_ID }}
          storageZoneName: ${{ secrets.BUNNY_ZONE_NAME }}
          storagePassword: ${{ secrets.BUNNY_PW_SITE }}
          accessKey: ${{ secrets.BUNNY_API_KEY }}
          upload: "true"
          remove: "true"
          purgePullZone: "true"
          purgePullZoneDelay: "5"
          maxRetries: "5"
